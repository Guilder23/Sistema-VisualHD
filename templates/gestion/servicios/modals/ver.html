{% load static %}
<div class="modal fade" id="modalVerServicio" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-camera-retro"></i> Detalle del Servicio</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <dl class="row">
                    <dt class="col-sm-3">Nombre</dt><dd class="col-sm-9" id="ver_nombre"></dd>
                    <dt class="col-sm-3">Descripción</dt><dd class="col-sm-9" id="ver_descripcion"></dd>
                    <dt class="col-sm-3">Precio (Bs)</dt><dd class="col-sm-9" id="ver_precio"></dd>
                    <dt class="col-sm-3">Duración</dt><dd class="col-sm-9" id="ver_duracion"></dd>
                    <dt class="col-sm-3">Estado</dt><dd class="col-sm-9" id="ver_estado"></dd>
                    <dt class="col-sm-3">Registrado</dt><dd class="col-sm-9" id="ver_creado"></dd>
                </dl>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
