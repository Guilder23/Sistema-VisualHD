{% load static %}
<div class="modal fade" id="modalEditarServicio" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <form method="post" id="formEditarServicio" action="">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-edit"></i> Editar Servicio</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="editar_nombre">Nombre del servicio</label>
                        <input type="text" id="editar_nombre" name="nombre" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="editar_descripcion">Descripción</label>
                        <textarea id="editar_descripcion" name="descripcion" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label for="editar_precio">Precio (Bs)</label>
                            <input type="number" step="0.01" min="0" id="editar_precio" name="precio" class="form-control">
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="editar_duracion_minutos">Duración (minutos)</label>
                            <input type="number" min="0" id="editar_duracion_minutos" name="duracion_minutos" class="form-control">
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="editar_estado">Estado</label>
                            <select id="editar_estado" name="estado" class="form-control">
                                <option value="activo">Activo</option>
                                <option value="inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
