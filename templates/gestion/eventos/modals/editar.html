<div class="modal fade" id="modalEditarEvento" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Editar Evento</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form method="POST" id="formEditarEvento">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Cliente</label>
                                <select name="cliente_id" id="editar_evento_cliente" class="form-control" required>
                                    <option value="">Seleccionar...</option>
                                    {% for cliente in clientes %}
                                    <option value="{{ cliente.id }}">{{ cliente.nombre }} {{ cliente.apellido }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Nombre del Evento</label>
                                <input type="text" name="nombre" id="editar_evento_nombre" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Servicio</label>
                        <select name="servicio_id" id="editar_evento_servicio" class="form-control" required>
                            <option value="">Seleccionar servicio...</option>
                            {% for servicio in servicios %}
                            <option value="{{ servicio.id }}">{{ servicio.nombre }} - Bs. {{ servicio.precio|floatformat:2 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Paquete</label>
                        <select name="paquete_id" id="editar_evento_paquete" class="form-control" disabled>
                            <option value="">Seleccione un servicio primero...</option>
                        </select>
                    </div>
                    <div id="editar_paquete_detalles" class="alert alert-info" style="display: none;">
                        <h6 id="editar_paquete_nombre"></h6>
                        <table class="table table-sm table-bordered">
                            <thead class="bg-light">
                                <tr>
                                    <th>Descripción</th>
                                    <th>Precio Unit.</th>
                                    <th>Cant.</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="editar_paquete_detalles_body"></tbody>
                        </table>
                        <strong>Precio Total: Bs. <span id="editar_paquete_precio_total"></span></strong>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Fecha Inicio</label>
                                <input type="datetime-local" name="fecha_inicio" id="editar_evento_fecha_inicio" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Fecha Fin</label>
                                <input type="datetime-local" name="fecha_fin" id="editar_evento_fecha_fin" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Ubicación</label>
                                <input type="text" name="ubicacion" id="editar_evento_ubicacion" class="form-control">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Presupuesto (Bs.)</label>
                                <input type="number" name="presupuesto" id="editar_evento_presupuesto" step="0.01" class="form-control">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Estado</label>
                                <select name="estado" id="editar_evento_estado" class="form-control">
                                    <option value="planificado">Planificado</option>
                                    <option value="confirmado">Confirmado</option>
                                    <option value="en_progreso">En progreso</option>
                                    <option value="completado">Completado</option>
                                    <option value="cancelado">Cancelado</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6"></div>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="descripcion" id="editar_evento_descripcion" class="form-control"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
