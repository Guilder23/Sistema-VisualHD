<div class="modal fade" id="modalCrearEvento" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nuevo Evento</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form method="POST" action="{% url 'eventos:crear_evento' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Cliente</label>
                                <select name="cliente_id" class="form-control" required>
                                    <option value="">Seleccionar...</option>
                                    {% for cliente in clientes %}
                                    <option value="{{ cliente.id }}">{{ cliente.nombre }} {{ cliente.apellido }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Nombre del Evento</label>
                                <input type="text" name="nombre" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Servicio</label>
                        <select name="servicio_id" id="crear_evento_servicio" class="form-control" required>
                            <option value="">Seleccionar servicio...</option>
                            {% for servicio in servicios %}
                            <option value="{{ servicio.id }}">{{ servicio.nombre }} - Bs. {{ servicio.precio|floatformat:2 }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Paquete</label>
                        <select name="paquete_id" id="crear_evento_paquete" class="form-control" disabled>
                            <option value="">Seleccione un servicio primero...</option>
                        </select>
                    </div>
                    <div id="crear_paquete_detalles" class="alert alert-info" style="display: none;">
                        <h6 id="crear_paquete_nombre"></h6>
                        <table class="table table-sm table-bordered">
                            <thead class="bg-light">
                                <tr>
                                    <th>Descripción</th>
                                    <th>Precio Unit.</th>
                                    <th>Cant.</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="crear_paquete_detalles_body"></tbody>
                        </table>
                        <strong>Precio Total: Bs. <span id="crear_paquete_precio_total"></span></strong>
                    </div>

                    <hr>
                    <h6 class="mb-3"><i class="fas fa-plus-circle"></i> Adicionales</h6>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <input type="text" id="crear_evento_adicional_descripcion" class="form-control" placeholder="Descripción del adicional (ej: Dron)">
                        </div>
                        <div class="col-md-2">
                            <input type="number" id="crear_evento_adicional_precio" class="form-control" placeholder="Precio" step="0.01" min="0">
                        </div>
                        <div class="col-md-2">
                            <input type="number" id="crear_evento_adicional_cantidad" class="form-control" placeholder="Cant." value="1" min="1">
                        </div>
                        <div class="col-md-2">
                            <button type="button" id="crear_evento_btn_agregar_adicional" class="btn btn-success btn-block">
                                <i class="fas fa-plus"></i> Agregar
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered">
                            <thead class="bg-light">
                                <tr>
                                    <th>Descripción</th>
                                    <th style="width: 100px;">Precio Unit.</th>
                                    <th style="width: 80px;">Cant.</th>
                                    <th style="width: 120px;">Subtotal</th>
                                    <th style="width: 60px;"></th>
                                </tr>
                            </thead>
                            <tbody id="crear_evento_adicionales_body"></tbody>
                        </table>
                    </div>
                    <input type="hidden" name="adicionales_json" id="crear_evento_adicionales_json">

                    <div class="row mt-3">
                        <div class="col-md-6 offset-md-6">
                            <div class="card bg-light">
                                <div class="card-body py-2">
                                    <div class="d-flex justify-content-between"><span>Total Paquete:</span> <span>Bs. <span id="crear_evento_total_paquete">0.00</span></span></div>
                                    <div class="d-flex justify-content-between"><span>Total Adicionales:</span> <span>Bs. <span id="crear_evento_total_adicionales">0.00</span></span></div>
                                    <hr class="my-1">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <strong>Total General:</strong>
                                        <span class="h4 mb-0">Bs. <span id="crear_evento_total_general">0.00</span></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Fecha Inicio</label>
                                <input type="datetime-local" name="fecha_inicio" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label>Fecha Fin</label>
                                <input type="datetime-local" name="fecha_fin" class="form-control" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" name="ubicacion" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
