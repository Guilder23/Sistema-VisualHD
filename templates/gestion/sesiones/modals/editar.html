{% load static %}
<div class="modal fade" id="modalEditarSesion" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content">
            <form method="post" id="formEditarSesion" action="">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-edit"></i> Editar Sesión</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="editar_cliente_id">Cliente</label>
                            <select id="editar_cliente_id" name="cliente_id" class="form-control" required>
                                {% for cliente in clientes %}
                                <option value="{{ cliente.pk }}">{{ cliente }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="editar_servicio_id">Servicio</label>
                            <select id="editar_servicio_id" name="servicio_id" class="form-control">
                                <option value="">Sin servicio específico</option>
                                {% for servicio in servicios %}
                                <option value="{{ servicio.pk }}">{{ servicio }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label for="editar_empleado_id">Fotógrafo asignado</label>
                            <select id="editar_empleado_id" name="empleado_id" class="form-control">
                                <option value="">Sin asignar</option>
                                {% for empleado in empleados %}
                                <option value="{{ empleado.pk }}">{{ empleado }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="editar_fecha">Fecha</label>
                            <input type="date" id="editar_fecha" name="fecha" class="form-control">
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="editar_hora">Hora</label>
                            <input type="time" id="editar_hora" name="hora" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="editar_lugar">Lugar</label>
                            <input type="text" id="editar_lugar" name="lugar" class="form-control">
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="editar_estado">Estado</label>
                            <select id="editar_estado" name="estado" class="form-control">
                                <option value="pendiente">Pendiente</option>
                                <option value="confirmada">Confirmada</option>
                                <option value="realizada">Realizada</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <hr>
                    <h6 class="mb-3"><i class="fas fa-plus-circle"></i> Servicios e ítems</h6>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <input type="text" id="editar_sesion_adicional_descripcion" class="form-control" placeholder="Descripción del adicional (ej: Dron)">
                        </div>
                        <div class="col-md-2">
                            <input type="number" id="editar_sesion_adicional_precio" class="form-control" placeholder="Precio" step="0.01" min="0">
                        </div>
                        <div class="col-md-2">
                            <input type="number" id="editar_sesion_adicional_cantidad" class="form-control" placeholder="Cant." value="1" min="1">
                        </div>
                        <div class="col-md-2">
                            <button type="button" id="editar_sesion_btn_agregar_adicional" class="btn btn-success btn-block">
                                <i class="fas fa-plus"></i> Agregar
                            </button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered">
                            <thead class="bg-light">
                                <tr>
                                    <th>Descripción</th>
                                    <th style="width: 100px;">Precio Unit.</th>
                                    <th style="width: 80px;">Cant.</th>
                                    <th style="width: 120px;">Subtotal</th>
                                    <th style="width: 60px;"></th>
                                </tr>
                            </thead>
                            <tbody id="editar_sesion_adicionales_body"></tbody>
                        </table>
                    </div>
                    <input type="hidden" name="adicionales_json" id="editar_sesion_adicionales_json">

                    <div class="row mt-3">
                        <div class="col-md-6 offset-md-6">
                            <div class="card bg-light">
                                <div class="card-body py-2">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <strong>Total:</strong>
                                        <span class="h4 mb-0">Bs. <span id="editar_sesion_total">0.00</span></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="form-group mt-3">
                        <label for="editar_observacion">Observación</label>
                        <textarea id="editar_observacion" name="observacion" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
