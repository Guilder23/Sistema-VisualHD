{% load static %}
<div class="modal fade" id="modalCrearSesion" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <form method="post" action="{% url 'sesiones:crear_sesion' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-plus"></i> Nueva Sesión</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="crear_cliente_id">Cliente</label>
                            <select id="crear_cliente_id" name="cliente_id" class="form-control" required>
                                <option value="">Selecciona un cliente</option>
                                {% for cliente in clientes %}
                                <option value="{{ cliente.pk }}">{{ cliente }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="crear_servicio_id">Servicio</label>
                            <select id="crear_servicio_id" name="servicio_id" class="form-control">
                                <option value="">Sin servicio específico</option>
                                {% for servicio in servicios %}
                                <option value="{{ servicio.pk }}">{{ servicio }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="crear_empleado_id">Fotógrafo asignado</label>
                            <select id="crear_empleado_id" name="empleado_id" class="form-control">
                                <option value="">Sin asignar</option>
                                {% for empleado in empleados %}
                                <option value="{{ empleado.pk }}">{{ empleado }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-3 form-group">
                            <label for="crear_fecha">Fecha</label>
                            <input type="date" id="crear_fecha" name="fecha" class="form-control" required>
                        </div>
                        <div class="col-md-3 form-group">
                            <label for="crear_hora">Hora</label>
                            <input type="time" id="crear_hora" name="hora" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="crear_lugar">Lugar</label>
                        <input type="text" id="crear_lugar" name="lugar" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="crear_precio">Precio (Bs)</label>
                        <input type="number" step="0.01" min="0" id="crear_precio" name="precio" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="crear_observacion">Observación</label>
                        <textarea id="crear_observacion" name="observacion" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Sesión</button>
                </div>
            </form>
        </div>
    </div>
</div>
