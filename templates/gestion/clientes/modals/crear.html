{% load static %}
<div class="modal fade" id="modalCrearCliente" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <form method="post" action="{% url 'clientes:crear_cliente' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus"></i> Nuevo Cliente</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="crear_nombre">Nombres</label>
                            <input type="text" id="crear_nombre" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="crear_apellido">Apellidos</label>
                            <input type="text" id="crear_apellido" name="apellido" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="crear_email">Correo electrónico</label>
                            <input type="email" id="crear_email" name="email" class="form-control">
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="crear_telefono">Teléfono</label>
                            <input type="text" id="crear_telefono" name="telefono" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label for="crear_ci">CI / Carnet</label>
                            <input type="text" id="crear_ci" name="ci" class="form-control">
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="crear_ciudad">Ciudad</label>
                            <input type="text" id="crear_ciudad" name="ciudad" class="form-control">
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="crear_fecha_nacimiento">Fecha de nacimiento</label>
                            <input type="date" id="crear_fecha_nacimiento" name="fecha_nacimiento" class="form-control">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="crear_direccion">Dirección</label>
                        <input type="text" id="crear_direccion" name="direccion" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="crear_observacion">Observación</label>
                        <textarea id="crear_observacion" name="observacion" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>
