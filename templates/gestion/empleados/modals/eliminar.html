{% load static %}
<div class="modal fade" id="modalEliminarEmpleado" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm" role="document">
        <div class="modal-content">
            <form method="post" id="formEliminarEmpleado" action="">
                {% csrf_token %}
                <div class="modal-body text-center p-4">
                    <div class="eliminar-icon"><i class="fas fa-exclamation-triangle"></i></div>
                    <h5 class="mt-3">¿Eliminar empleado?</h5>
                    <p class="text-muted">Esta acción no se puede deshacer. Se eliminará a <strong id="eliminarEmpleadoNombre"></strong>.</p>
                    <div class="d-flex justify-content-center mt-3">
                        <button type="button" class="btn btn-outline-secondary mr-2" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
