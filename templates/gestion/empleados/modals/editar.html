{% load static %}
<div class="modal fade" id="modalEditarEmpleado" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <form method="post" id="formEditarEmpleado" action="">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-edit"></i> Editar Empleado</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="editar_nombre">Nombres</label>
                            <input type="text" id="editar_nombre" name="nombre" class="form-control" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="editar_apellido">Apellidos</label>
                            <input type="text" id="editar_apellido" name="apellido" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 form-group">
                            <label for="editar_cargo">Cargo</label>
                            <select id="editar_cargo" name="cargo" class="form-control">
                                <option value="fotografo">Fotógrafo</option>
                                <option value="editor">Editor</option>
                                <option value="asistente">Asistente</option>
                                <option value="administrativo">Administrativo</option>
                            </select>
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="editar_telefono">Teléfono</label>
                            <input type="text" id="editar_telefono" name="telefono" class="form-control">
                        </div>
                        <div class="col-md-4 form-group">
                            <label for="editar_estado">Estado</label>
                            <select id="editar_estado" name="estado" class="form-control">
                                <option value="activo">Activo</option>
                                <option value="inactivo">Inactivo</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="editar_email">Correo electrónico</label>
                        <input type="email" id="editar_email" name="email" class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="editar_observacion">Observación</label>
                        <textarea id="editar_observacion" name="observacion" class="form-control" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>
