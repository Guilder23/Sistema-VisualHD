<div class="modal fade" id="modalCrearCita" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Nueva Cita</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form method="POST" action="{% url 'agenda:crear_cita' %}">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="form-group">
                        <label>Cliente</label>
                        <select name="cliente_id" class="form-control" required>
                            <option value="">Seleccionar...</option>
                            {% for cliente in clientes %}
                            <option value="{{ cliente.id }}">{{ cliente.nombre }} {{ cliente.apellido }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Fecha y Hora</label>
                        <input type="datetime-local" name="fecha" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Empleado</label>
                        <select name="empleado_id" class="form-control">
                            <option value="">Seleccionar...</option>
                            {% for empleado in empleados %}
                            <option value="{{ empleado.id }}">{{ empleado.nombre }} ({{ empleado.especialidad }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Duración (minutos)</label>
                        <input type="number" name="duracion_minutos" class="form-control" value="60" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea name="descripcion" class="form-control"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" name="ubicacion" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</div>
