{% load static %}
<link rel="stylesheet" href="{% static 'css/gestion/finanzas/pagos_empleados/modals/crear.css' %}">

<div class="modal fade" id="modalPagoEmpleado" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="post" action="{% url 'finanzas:crear_pago_empleado' %}">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title">Registrar pago a empleado</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-row">
                        <div class="form-group col-md-6"><label>Empleado</label><select name="empleado_id" class="form-control" required><option value="">Seleccionar...</option>{% for empleado in empleados %}<option value="{{ empleado.id }}">{{ empleado }}</option>{% endfor %}</select></div>
                        <div class="form-group col-md-6"><label>Mes / Año</label><input type="text" name="mes_año" class="form-control" placeholder="08/2026" maxlength="10" required></div>
                        <div class="form-group col-md-4"><label>Monto base (Bs.)</label><input type="number" name="monto_base" step="0.01" min="0" class="form-control" required></div>
                        <div class="form-group col-md-4"><label>Bonificación (Bs.)</label><input type="number" name="bonificacion" step="0.01" min="0" value="0" class="form-control"></div>
                        <div class="form-group col-md-4"><label>Descuentos (Bs.)</label><input type="number" name="descuentos" step="0.01" min="0" value="0" class="form-control"></div>
                        <div class="form-group col-md-4"><label>Total a pagar (Bs.)</label><input type="number" name="total_a_pagar" step="0.01" min="0" class="form-control" required></div>
                        <div class="form-group col-md-4"><label>Monto pagado (Bs.)</label><input type="number" name="monto_pagado" step="0.01" min="0" value="0" class="form-control"></div>
                        <div class="form-group col-md-4"><label>Estado</label><select name="estado" class="form-control">{% for valor, etiqueta in estados %}<option value="{{ valor }}">{{ etiqueta }}</option>{% endfor %}</select></div>
                        <div class="form-group col-md-6"><label>Fecha de pago</label><input type="date" name="fecha_pago" class="form-control"></div>
                        <div class="form-group col-md-6"><label>Comprobante</label><input type="text" name="comprobante" class="form-control"></div>
                        <div class="form-group col-md-12"><label>Notas</label><textarea name="notas" class="form-control"></textarea></div>
                    </div>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-light" data-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary">Guardar pago</button></div>
            </form>
        </div>
    </div>
</div>

<script src="{% static 'js/gestion/finanzas/pagos_empleados/modals/crear.js' %}"></script>
