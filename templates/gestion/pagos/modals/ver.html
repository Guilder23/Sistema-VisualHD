{% load static %}
<div class="modal fade" id="modalVerPago" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-money-bill-wave"></i> Detalle del Pago</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Cerrar"><span aria-hidden="true">&times;</span></button>
            </div>
            <div class="modal-body">
                <dl class="row">
                    <dt class="col-sm-3">Cliente</dt><dd class="col-sm-9" id="ver_cliente"></dd>
                    <dt class="col-sm-3">Sesión</dt><dd class="col-sm-9" id="ver_sesion"></dd>
                    <dt class="col-sm-3">Monto (Bs)</dt><dd class="col-sm-9" id="ver_monto"></dd>
                    <dt class="col-sm-3">Método</dt><dd class="col-sm-9" id="ver_metodo"></dd>
                    <dt class="col-sm-3">Estado</dt><dd class="col-sm-9" id="ver_estado"></dd>
                    <dt class="col-sm-3">Fecha de pago</dt><dd class="col-sm-9" id="ver_fecha"></dd>
                    <dt class="col-sm-3">Observación</dt><dd class="col-sm-9" id="ver_observacion"></dd>
                </dl>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
